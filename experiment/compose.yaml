# Starter deployment template. Set the required variables before use.
services:
  gotify:
    image: "${GOTIFY_IMAGE:?Set an immutable image reference}"
    pull_policy: never
    restart: "no"
    ports:
      - "127.0.0.1:${GOTIFY_HOST_PORT:?Set the host port}:80"
    environment:
      GOTIFY_SERVER_PORT: "80"
      GOTIFY_DATABASE_DIALECT: sqlite3
      GOTIFY_DATABASE_CONNECTION: /app/data/gotify.db
      GOTIFY_DEFAULTUSER_NAME: experiment
      GOTIFY_DEFAULTUSER_PASS_FILE: /run/secrets/admin_password
      GOTIFY_SERVER_SECURECOOKIE: "false"
      GOTIFY_REGISTRATION: "false"
    secrets:
      - admin_password
    volumes:
      - "${GOTIFY_DATA_DIR:?Set an absolute dedicated data directory}:/app/data"
    labels:
      experiment.execution_id: "${GOTIFY_EXECUTION_ID:-local-foundation}"
      experiment.trial_id: "${GOTIFY_TRIAL_ID:?Set a trial ID}"
      experiment.release_sha: "${GOTIFY_RELEASE_SHA:?Set the source SHA}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:80/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

secrets:
  admin_password:
    file: "${GOTIFY_ADMIN_PASSWORD_FILE:?Set an absolute password-file path}"
