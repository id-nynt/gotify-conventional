name: Gotify conventional experiment
run-name: conventional-${{ inputs.trial_id || github.run_id }}
on:
  workflow_dispatch:
    inputs:
      trial_id:
        description: Optional fresh trial identifier for an external scenario
        required: false
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: gotify-experiment
  cancel-in-progress: false
jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build frontend
        run: |
          (cd ui && yarn --frozen-lockfile)
          make build-js
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          args: --timeout=5m
          skip-cache: true
      - name: Upstream tests and checks
        run: |
          go mod download
          make download-tools
          make test
          make check-ci
      - name: Experiment controller and operation checks
        run: |
          python3 -m pip install --user PyYAML==6.0.2
          python3 -m unittest discover -s experiment -p 'test_*.py' -v
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package identifiable baseline and candidate
        env:
          GOTIFY_REGISTRY: ghcr.io/id-nynt/gotify-conventional-experiment
        run: bash experiment/build_images.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: experiment/build/*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-evidence
          path: coverage.txt
          if-no-files-found: ignore
  deploy-verify-recover:
    needs: build-test-package
    runs-on: [self-hosted, Linux, X64, gotify-conventional]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      TRIAL_ID: ${{ inputs.trial_id || format('conventional-{0}-{1}', github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install browser probe dependency
        run: (cd ui && yarn --frozen-lockfile)
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: experiment/build
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Conventional sequencing and bounded recovery
        run: python3 experiment/conventional.py --trial "$TRIAL_ID" --manifest experiment/build/images.json
      - name: Locate public evidence
        if: always()
        run: echo "EVIDENCE_DIR=$HOME/gotify-study-runtime/trials/conventional/$TRIAL_ID/evidence" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-evidence-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
